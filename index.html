<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <h1>AI Agent</h1>
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <span class="btn-icon">+</span>
                    New Chat
                </button>
            </div>

            <div class="agent-status">
                <h3>Active Agents</h3>
                <div class="agent-grid">
                    <div class="agent-badge" data-agent="email">
                        <span class="agent-icon">📧</span>
                        <span>Email</span>
                    </div>
                    <div class="agent-badge" data-agent="sql">
                        <span class="agent-icon">🗄️</span>
                        <span>SQL</span>
                    </div>
                    <div class="agent-badge" data-agent="drive">
                        <span class="agent-icon">📁</span>
                        <span>Drive</span>
                    </div>
                    <div class="agent-badge" data-agent="calendar">
                        <span class="agent-icon">📅</span>
                        <span>Calendar</span>
                    </div>
                    <div class="agent-badge" data-agent="docs">
                        <span class="agent-icon">📝</span>
                        <span>Docs</span>
                    </div>
                    <div class="agent-badge" data-agent="general">
                        <span class="agent-icon">💬</span>
                        <span>General</span>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="connectionStatus">Connected</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <div class="chat-header">
                <h2>Multi-Agent Assistant</h2>
                <div class="header-actions">
                    <button class="icon-btn" id="clearHistoryBtn" title="Clear History">
                        <span>🔄</span>
                    </button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="welcome-message">
                    <div class="welcome-icon">✨</div>
                    <h2>Welcome to AI Agent Assistant</h2>
                    <p>I can help you with email, database queries, file management, calendar scheduling, and more.</p>
                    <div class="suggestions">
                        <button class="suggestion-chip" data-query="Show me all tables in the Salesforce database">
                            🗄️ Show database tables
                        </button>
                        <button class="suggestion-chip" data-query="Create a calendar event for tomorrow at 2pm">
                            📅 Schedule meeting
                        </button>
                        <button class="suggestion-chip" data-query="Check my latest 5 emails">
                            📧 Check emails
                        </button>
                    </div>
                </div>
            </div>

            <div class="input-container">
                <form id="chatForm" class="chat-form">
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Ask me anything..." rows="1"
                            autocomplete="off"></textarea>
                        <button type="submit" class="send-btn" id="sendBtn">
                            <span class="send-icon">➤</span>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
